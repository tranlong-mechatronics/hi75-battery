[package]
name = "hi75-battery"
version = "0.2.0"
edition = "2024"

[dependencies]
auto-launch = "0.6.0"
hidapi = "2.6.7"
image = "0.25.10"
muda = "0.21.2"
resvg = "0.49.0"
tray-icon = "0.26.1"
winapi = { version = "0.3.9", features = ["winuser", "shellapi", "libloaderapi", "errhandlingapi", "winreg", "wingdi", "windef", "processthreadsapi", "commctrl"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.59.0", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winit = "0.30.13"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

